[project]
name = "terra-engine"
version = "0.1.0"
description = "TERRA satellite credit scoring engine"
requires-python = ">=3.12"
dependencies = [
    "pystac-client",
    "rasterio",
    "numpy",
    "fastapi",
    "uvicorn",
    "httpx",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["terra_engine"]
