<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRA — Satellite Credit Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0a0f0d;
    --panel: #111a16;
    --border: #1e2d26;
    --text: #e8f2ec;
    --muted: #7fa08f;
    --accent: #4ade80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding: 40px clamp(16px, 6vw, 80px);
  }
  header { margin-bottom: 36px; }
  header h1 {
    font-size: 28px;
    letter-spacing: 4px;
    font-weight: 600;
  }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); margin-top: 6px; font-size: 14px; }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 36px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    transition: transform .2s ease, border-color .2s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .card .id { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .score { font-size: 44px; font-weight: 700; color: var(--accent); line-height: 1; }
  .score-label { color: var(--muted); font-size: 12px; margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .components { margin-top: 16px; display: grid; gap: 8px; }
  .component { font-size: 12px; color: var(--muted); }
  .bar {
    height: 5px;
    background: var(--border);
    border-radius: 3px;
    margin-top: 4px;
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    border-radius: 3px;
  }
  .chart-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  .chart-panel h2 { font-size: 15px; margin-bottom: 18px; color: var(--muted); font-weight: 500; }
  #status { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>TERRA<span>.</span></h1>
  <p>Satellite credit intelligence — Bugesera District, Rwanda · Sentinel-2</p>
</header>
<div id="status">Loading farm data…</div>
<div class="cards" id="cards"></div>
<div class="chart-panel" id="chartPanel" style="display:none">
  <h2>Field health (NDVI) — last two years, cloud-masked</h2>
  <canvas id="chart" height="90"></canvas>
</div>
<script>
const COLORS = ["#4ade80", "#38bdf8", "#fbbf24"];

function componentRow(label, value) {
  return `<div class="component">${label} · ${(value * 100).toFixed(0)}%<div class="bar"><i style="width:${value * 100}%"></i></div></div>`;
}

async function load() {
  const res = await fetch("/api/farms");
  const data = await res.json();
  const cards = document.getElementById("cards");
  const datasets = [];

  for (const [i, farm] of data.farms.entries()) {
    const s = farm.score;
    cards.insertAdjacentHTML("beforeend", `
      <div class="card">
        <h2>${farm.name}</h2>
        <div class="id">${farm.id} · ${s ? s.seasons_observed : 0} seasons observed</div>
        <div class="score" style="color:${COLORS[i % COLORS.length]}">${s ? s.terra_score : "—"}</div>
        <div class="score-label">TERRA Score (300–850)</div>
        <div class="components">
          ${s ? componentRow("Productivity", s.peak_component) : ""}
          ${s ? componentRow("Consistency", s.consistency_component) : ""}
          ${s ? componentRow("Trend", s.trend_component) : ""}
        </div>
      </div>`);

    const ts = await fetch(`/api/farms/${farm.id}/timeseries`).then(r => r.json());
    datasets.push({
      label: farm.name,
      data: ts.readings.map(r => ({ x: r.date, y: +r.ndvi_mean })),
      borderColor: COLORS[i % COLORS.length],
      backgroundColor: "transparent",
      tension: 0.35,
      pointRadius: 2.5,
    });
  }

  document.getElementById("status").style.display = "none";
  document.getElementById("chartPanel").style.display = "block";
  new Chart(document.getElementById("chart"), {
    type: "line",
    data: { datasets },
    options: {
      parsing: { xAxisKey: "x", yAxisKey: "y" },
      scales: {
        x: { type: "category", grid: { color: "#1e2d26" }, ticks: { color: "#7fa08f", maxTicksLimit: 14 } },
        y: { min: 0, max: 0.9, grid: { color: "#1e2d26" }, ticks: { color: "#7fa08f" }, title: { display: true, text: "NDVI", color: "#7fa08f" } },
      },
      plugins: { legend: { labels: { color: "#e8f2ec" } } },
    },
  });
}

load().catch(e => document.getElementById("status").textContent = "Failed to load: " + e.message);
</script>
</body>
</html>
